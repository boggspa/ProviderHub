<meta charset="utf-8">
<title>Provider Hub Shell</title>
<style>
/* Layout: the whole window is TaskWraith's picker shell. Left rail = provider icons, then permanent Claude and
   Codex tabs, then Audit (debug). Middle = the selected tab's pane. Right = status, actions, and the selected
   item's settings. Guided mode adds a checklist strip; Expert hides it. */
:root{
  color-scheme:dark;
  --stage:#121216; --surface-1:#1c1c20; --surface-2:#24242a; --surface-3:#2e2e36;
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12);
  --fg:#ececf1; --fg-2:#a3a3ad; --fg-3:#6f6f7a;
  --chroma-1:#5a8cff; --chroma-2:#bf7cff; --chroma-3:#41c7e5;
  --brand:#ff6e2e; --ink:#fff; --ok:#3ecf8e; --warn:#f5b642; --bad:#ff5d5d;
  --claude:#d97b3a; --codex:#705aff;
  --glass:rgba(20,20,24,.52); --glass-2:rgba(255,255,255,.04); --sheen:rgba(220,224,232,.22); --rim:rgba(255,255,255,.14); --logo-bg:rgba(255,255,255,.07);
  --font:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif; --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --r-sm:7px; --r-md:11px; --r-lg:16px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light; --stage:#e9e9ee; --surface-1:#f7f7fa; --surface-2:#ffffff; --surface-3:#ededf2;
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.16); --fg:#17171c; --fg-2:#5a5a66; --fg-3:#8a8a96;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.35); --sheen:rgba(255,255,255,.9); --rim:rgba(255,255,255,.8); --logo-bg:rgba(0,0,0,.05)}}
:root[data-theme="light"]{
  color-scheme:light; --stage:#e9e9ee; --surface-1:#f7f7fa; --surface-2:#ffffff; --surface-3:#ededf2;
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.16); --fg:#17171c; --fg-2:#5a5a66; --fg-3:#8a8a96;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.35); --sheen:rgba(255,255,255,.9); --rim:rgba(255,255,255,.8); --logo-bg:rgba(0,0,0,.05)}
.logo-light{display:none}.logo-dark{display:block}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .logo-light{display:block} :root:not([data-theme="dark"]) .logo-dark{display:none}}
:root[data-theme="light"] .logo-light{display:block} :root[data-theme="light"] .logo-dark{display:none}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--fg);font:13px/1.45 var(--font);padding-block:28px;padding-inline:16px;min-height:100%;
  background-image:radial-gradient(ellipse 60% 50% at 18% 10%,color-mix(in srgb,var(--chroma-1) 45%,transparent),transparent 70%),
  radial-gradient(ellipse 50% 45% at 85% 20%,color-mix(in srgb,var(--chroma-2) 40%,transparent),transparent 70%),
  radial-gradient(ellipse 55% 40% at 55% 95%,color-mix(in srgb,var(--chroma-3) 32%,transparent),transparent 70%);background-attachment:fixed}
h1,h2,h3{margin:0;text-wrap:balance} button{font:inherit;color:inherit;cursor:pointer} input{font:inherit}
.meta{max-width:980px;margin:0 auto 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meta h1{font-size:15px;font-weight:600}.meta p{margin:0;color:var(--fg-2);flex:1 1 320px;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;color:var(--fg-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border-strong)}
.sw{display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);font-weight:500}
.tg{appearance:none;width:28px;height:17px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;margin:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:1.5px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--fg-2);transition:.15s}
.tg:checked{background:var(--acc,var(--chroma-1));border-color:transparent}.tg:checked::after{left:13px;background:#fff}
.logo{width:var(--s,28px);height:var(--s,28px);border-radius:7px;background:var(--logo-bg);display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.logo img{width:72%;height:72%;object-fit:contain;display:block}
.logo.wide img{height:60%;width:auto;max-width:none;object-fit:cover;object-position:left center;margin-left:14%}.logo.wide{justify-items:start}
.logo .code{font:700 calc(var(--s,28px)*.33)/1 var(--font);color:var(--acc);letter-spacing:.02em}
.logo.tpl img{filter:brightness(0) invert(1);opacity:.85}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .logo.tpl img{filter:none;opacity:.8}} :root[data-theme="light"] .logo.tpl img{filter:none;opacity:.8}
.btn{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--surface-3)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc,var(--brand));border-color:transparent;color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 6px 18px color-mix(in srgb,var(--acc,var(--brand)) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}.btn.big{padding:10px 16px;font-size:14px;font-weight:600}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border-strong))}
:is(.btn,.ptab,.mrow,.choice,.tp,.acct):focus-visible{outline:2px solid var(--chroma-1);outline-offset:2px}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}

/* ===== the shell ===== */
.shell{--tab:30px;--tabgap:4px;--railw:54px;max-width:980px;margin:0 auto;height:700px;display:grid;grid-template-columns:var(--railw) minmax(0,1fr) 224px;grid-template-rows:42px minmax(0,1fr);
  background:var(--glass);backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid var(--rim);border-radius:22px;
  box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.4),inset 0 1px 0 var(--sheen),inset 0 -1px 0 rgba(255,255,255,.05);overflow:hidden;position:relative;isolation:isolate;transition:grid-template-columns 200ms cubic-bezier(.22,1,.36,1)}
.shell::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(118deg,rgba(255,255,255,.14) 0%,transparent 28%,transparent 70%,rgba(255,255,255,.06) 100%)}
.shell::after{content:"";position:absolute;inset:-40% -20% auto;height:60%;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(closest-side,var(--sheen),transparent);opacity:.18}
.shell.rail-open{--railw:200px}
.shell>*{position:relative;z-index:2}
.titlebar{grid-column:2/-1;grid-row:1;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;border-bottom:1px solid var(--border)}
.lights{display:flex;gap:6px;padding:4px 0 10px 12px;align-self:flex-start;flex:none}.lights i{width:11px;height:11px;border-radius:50%}.shell.rail-open .lights{padding-left:12px}.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.appicon{width:20px;height:20px;border-radius:5px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.4)}.shell.compact .appicon{width:18px;height:18px}
.mark{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,var(--chroma-1),var(--chroma-2));position:relative;flex:none}.mark::after{content:"";position:absolute;inset:4.5px;border-radius:2px;background:var(--surface-1);opacity:.9}
.titlebar .name{font-weight:600}.titlebar .crumb{color:var(--fg-3)}.titlebar .crumb b{color:var(--fg-2);font-weight:500}
.titlebar .gw{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-2)}.titlebar .gw .btn.sm{padding:2px 8px;font-size:10.5px;margin-right:4px}.titlebar .gw code{font:11px var(--mono);color:var(--fg-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);flex:none}.dot.off{background:var(--fg-3);box-shadow:none}
.rail{grid-row:1/3;grid-column:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--tabgap);padding:12px 0 8px;border-right:1px solid var(--border);overflow:hidden}
.railscroll{display:flex;flex-direction:column;align-items:center;gap:var(--tabgap);width:100%;flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}.railscroll::-webkit-scrollbar{display:none}
.railapps{display:flex;flex-direction:column;align-items:center;gap:var(--tabgap);width:100%;flex:none;padding-top:6px;border-top:1px solid var(--border);margin-top:4px}
.rail .sep{width:18px;height:1px;background:var(--border-strong);margin:5px 0;flex:none}
.rail .spacer{display:none}
.rail .grp{display:none;width:100%;padding:8px 14px 2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.rail .collapse{margin-top:6px;width:var(--tab);height:26px;border:0;background:transparent;border-radius:8px;color:var(--fg-3);display:grid;place-items:center;flex:none}.rail .collapse:hover{background:var(--glass-2);color:var(--fg)}
.rail .collapse::before{content:"›";font-size:16px;transition:transform 200ms}.shell.rail-open .rail .collapse::before{transform:rotate(180deg)}
.shell.rail-open .rail{align-items:stretch;padding:12px 8px 8px}.shell.rail-open .railscroll,.shell.rail-open .railapps{align-items:stretch}.shell.rail-open .ptab{justify-items:start}.shell.rail-open .rail .grp{display:block}.shell.rail-open .rail .sep{display:none}
.shell.rail-open .ptab{width:100%;height:32px;display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:0 8px 0 7px;text-align:left}
.shell.rail-open .ptab .lbl{display:block}.ptab .lbl{display:none;font-size:12.5px;font-weight:500;color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ptab.is-active .lbl{color:var(--fg)}
.shell.rail-open .ptab .st{position:static;width:auto;height:auto;border:0;background:transparent!important;font-size:10.5px;color:var(--fg-3);display:none}
.shell.rail-open .ptab.app{width:100%;height:34px}.shell.rail-open .ptab .ct{display:block}.ptab .ct{display:none;font:11px var(--mono);color:var(--fg-3)}
.shell.rail-open .pind{width:100%!important;left:8px;right:8px;margin-left:0!important}
.shell.rail-open .ptab .live{position:static;margin-left:4px}
.pind{position:absolute;left:50%;top:0;width:var(--tab);height:var(--tab);margin-left:calc(var(--tab)/-2);border-radius:8px;background:color-mix(in srgb,var(--acc,var(--chroma-1)) 17%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc,var(--chroma-1)) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.07);pointer-events:none;transition:transform 180ms cubic-bezier(.22,1,.36,1),background-color 180ms,box-shadow 180ms}
.ptab{position:relative;z-index:1;width:var(--tab);height:var(--tab);flex:none;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0;transition:background-color 120ms}
.ptab .logo{--s:18px;background:transparent;border-radius:0;opacity:.85;transition:opacity 120ms}.ptab:hover .logo,.ptab.is-active .logo{opacity:1}
.ptab:hover:not(.is-active){background:color-mix(in srgb,var(--acc) 9%,transparent)}
.ptab[data-state="key"] .logo,.ptab[data-state="off"] .logo{opacity:.62}
.ptab .st{position:absolute;right:1px;bottom:1px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--surface-1);background:var(--fg-3)}
.ptab[data-state="on"] .st,.ptab[data-state="local"] .st{background:var(--ok)}.ptab[data-state="key"] .st{background:var(--warn)}.ptab[data-state="app"] .st,.ptab[data-state="audit"] .st{display:none}
.ptab.app{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent)}
.ptab.app .logo{--s:20px}.ptab.app.is-active{background:color-mix(in srgb,var(--acc) 22%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)}
.ptab.app .live{position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:1.5px solid var(--surface-1);display:none}.ptab.app[data-live="1"] .live{display:block}
.ptab.audit .glyph{font:600 12px var(--mono);color:var(--fg-2)}
.ptab[hidden]{display:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto;padding:8px 6px 10px 10px}
.side{border-left:1px solid var(--border);padding:10px 10px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto}
.side .blk{display:grid;gap:4px}.side .stat .big{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.side .l{font-size:11px;color:var(--fg-3)}
.side .acts{display:grid;gap:5px;padding-top:8px;border-top:1px solid var(--border)}.side .acts .btn{font-size:12px;padding:5px 10px}
.side .note{font-size:11px;color:var(--fg-3);line-height:1.5}.side .grow{flex:1}
.checklist{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;margin:0 4px 8px 0;border:1px solid var(--border);border-radius:var(--r-md);background:color-mix(in srgb,var(--surface-2) 70%,transparent);font-size:12px;color:var(--fg-2)}
.checklist .ck{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px}.checklist .ck .n{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--fg-3)}
.checklist .ck.done .n{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}.checklist .ck.now{background:color-mix(in srgb,var(--chroma-1) 14%,transparent);color:var(--fg)}
.checklist .ck.now .n{border-color:var(--chroma-1);color:var(--chroma-1)}.checklist .btn{margin-left:auto}
.shell.expert .checklist{display:none}
.phead{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}.phead .pn{font-weight:700;font-size:16px}.phead .pd{font-size:12px;color:var(--fg-3);flex:1;min-width:0}
.state{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.state.on{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}.state.key{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.blk2{display:grid;gap:8px;padding:8px 6px 12px;border-top:1px solid var(--border)}
.blk2 .lbl{font-size:11px;color:var(--fg-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}.blk2 .lbl span{font-weight:500;letter-spacing:0;text-transform:none}
.blk2 .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk2 input[type=password],.blk2 input[type=text]{flex:1 1 200px;min-width:0;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:6px 9px;color:var(--fg);font:12.5px var(--mono)}
.blk2 .note{font-size:11.5px;color:var(--fg-2)}.blk2 .note a{color:var(--chroma-3);text-decoration:none}
.blk2 .seg{padding:2px}.blk2 .seg button{padding:3px 10px;font-size:12px}
.sel2{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:6px;padding:4px 9px;display:inline-flex;align-items:center;gap:8px;font-size:12px}.sel2::after{content:"⌄";color:var(--fg-3)}
.acct{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:12px}
.acct .rad{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none}.acct.active .rad{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 40%,transparent);box-shadow:inset 0 0 0 2px var(--surface-2)}
.acct .nm{flex:1;min-width:0}.acct small{color:var(--fg-3)}
.rows{display:flex;flex-direction:column;gap:1px}
.mrow{--racc:var(--acc);display:flex;align-items:center;gap:8px;padding:6px 10px;border:0;border-radius:6px;background:transparent;color:var(--fg);text-align:left;width:100%;font-size:14px}
.mrow:hover,.mrow.is-focused{background:color-mix(in srgb,var(--racc) 18%,transparent)}.mrow:not(.is-selected){color:var(--fg-2)}.mrow.is-selected{font-weight:500}
.mrow .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tierdot{font-size:10.5px;font-weight:600;color:var(--fg-3);flex:none;width:54px;text-align:right;white-space:nowrap}.mrow.is-selected .tierdot{color:color-mix(in srgb,var(--racc) 80%,var(--fg))}
.mrow .ap{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg-3)}.mrow .ap.on{background:color-mix(in srgb,var(--apc) 22%,transparent);color:var(--apc)}
.mrow .bolt{width:12px;height:12px;color:var(--racc);opacity:.8;flex:none}.mrow .chk{width:14px;flex:none;text-align:center;color:var(--racc);opacity:0;font-size:12px}.mrow.is-selected .chk{opacity:1}
.empty{padding:18px 12px;color:var(--fg-3);font-size:12px;text-align:center}
.psearch{margin:0 4px 6px 0;background:color-mix(in srgb,var(--fg) 6%,transparent);border:1px solid var(--border);border-radius:6px;padding:5px 9px;color:var(--fg);font-size:12px;width:auto}.psearch::placeholder{color:var(--fg-3)}
.tierpills{display:flex;flex-wrap:wrap;gap:4px}.tp{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;color:var(--fg-2)}
.tp:hover{background:var(--surface-3)}.tp[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:color-mix(in srgb,var(--acc) 80%,var(--fg))}
.tp.off[aria-pressed="true"]{background:var(--surface-3);border-color:var(--border-strong);color:var(--fg)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg-2)}.opts{display:grid;gap:7px}
.stp{display:inline-flex;align-items:center;gap:4px}.stp button{width:18px;height:18px;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:4px;padding:0;font-size:11px;line-height:1}.stp b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choices.two{grid-template-columns:repeat(2,1fr)}
.choice{border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:grid;gap:4px;align-content:start;position:relative}
.choice h3{font-size:13px;font-weight:600}.choice p{margin:0;color:var(--fg-2);font-size:11.5px}.choice .k{font:10.5px var(--mono);color:var(--fg-3)}
.choice[aria-pressed="true"]{border-color:color-mix(in srgb,var(--acc) 55%,var(--border));background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 12%,var(--surface-2)),color-mix(in srgb,var(--chroma-2) 8%,var(--surface-2)))}
.choice[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font-size:11px;font-weight:700;color:var(--acc)}
.shell.expert .choice p{display:none}
.tierlist{display:grid;gap:4px}.tl{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:12.5px}
.tl .t{font-weight:600}.tl .m{display:flex;align-items:center;gap:7px;min-width:0}.tl .m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tl small{color:var(--fg-3)}
.rank{display:grid;gap:4px}.rk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:12.5px}.rk .n{font:600 11px var(--mono);color:var(--fg-3)}

function materialise(){APPS.forEach(a=>{if(a.mode==='all')a.mode='curate'})}
function renderProvSide(p,on){side.style.setProperty('--acc',p.acc);
 let html=`<div class="blk stat"><div class="eyebrow">Status</div><div class="big">${on?p.models.length+' models':'—'}</div><div class="l">${on?p.models.filter(m=>CAT.get(m[1])?.claude||CAT.get(m[1])?.codex).length+' listed':ST[p.st]}</div></div>
  <div class="acts"><button class="btn" data-act="refresh" ${on?'':'disabled'}>Refresh</button><button class="btn" data-act="setup">Account ↗</button>${on&&p.id!=='ollama'?'<button class="btn danger" data-act="remove">Remove key</button>':''}</div>`;
 const c=focused&&CAT.get(focused);
 if(c){const m=p.models.find(m=>m[1]===focused);html+=`<div class="blk" style="border-top:1px solid var(--border);padding-top:8px"><div class="eyebrow">Selected</div><b style="font-size:12.5px">${m[0]}</b><code style="font:10.5px var(--mono);color:var(--fg-3)">${m[1]}</code><span class="l">${m[2]>=1000?(m[2]/1000)+'M':m[2]+'K'} context${m[4]?' · Fast':''}</span></div>
  <div class="blk"><div class="eyebrow">Claude tier</div><div class="tierpills">${TKEYS.map((k,i)=>`<button class="tp ${k==='off'?'off':''}" aria-pressed="${k===c.tier}" data-tier="${i}">${TIERS[i]}</button>`).join('')}</div></div>
  <div class="opts"><label class="opt">Tier default<input class="tg" type="checkbox" id="oDefault" ${c.def?'checked':''} ${c.tier==='off'?'disabled':''}></label><label class="opt">Claude<input class="tg" type="checkbox" id="oClaude" style="--acc:var(--claude)" ${c.claude?'checked':''}></label><label class="opt">Codex<input class="tg" type="checkbox" id="oCodex" style="--acc:var(--codex)" ${c.codex?'checked':''}></label><div class="opt">Subagent priority<span class="stp"><button id="rkDn">−</button><b>${c.rank}</b><button id="rkUp">+</button></span></div></div>`}
 else html+=`<div class="grow"></div>`;
 side.innerHTML=html;side.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>act(b.dataset.act,p,e));
 if(c){side.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tier;c.tier=TKEYS[i];if(i===0){c.claude=false;c.def=false}else c.claude=true;materialise();render()});
  side.querySelector('#oDefault').onchange=e=>{if(e.target.checked){for(const v of CAT.values())if(v.tier===c.tier)v.def=false;c.def=true;c.claude=true}else c.def=false;materialise();render()};
  side.querySelector('#oClaude').onchange=e=>{c.claude=e.target.checked;if(!c.claude){c.def=false;c.tier='off'}else if(c.tier==='off')c.tier='sonnet';materialise();render()};
  side.querySelector('#oCodex').onchange=e=>{c.codex=e.target.checked;materialise();render()};
  side.querySelector('#rkUp').onclick=()=>{c.rank=Math.max(1,c.rank-1);materialise();render()};side.querySelector('#rkDn').onclick=()=>{c.rank=Math.min(9,c.rank+1);materialise();render()}}}
function act(a,p,e){e?.preventDefault?.();
 if(a==='save'){if(!main.querySelector('#kfInput').value.trim()){toast('Paste a key first');return}p.st='on';p.models.forEach(m=>{if(!CAT.has(m[1]))CAT.set(m[1],{claude:true,codex:true,tier:m[3],def:false,rank:3,p:p.id})});render();toast(`${p.n} connected · ${p.models.length} models fetched`)}
 if(a==='signin'){p.st='on';p.sub='Signed in just now';p.accts=[['chris@…co.uk','',1]];render();toast(`${p.n} signed in through its own CLI`)}
 if(a==='check')toast(p.st==='on'?`${p.n}: sign-in valid`:`${p.n}: not signed in`);
 if(a==='refresh'||a==='reconnect')toast(`${p.n}: catalogue refreshed`);
 if(a==='setup')toast(`Opens ${p.n}'s account page in your browser`);
 if(a==='remove'){p.st='key';p.models.forEach(m=>CAT.delete(m[1]));focused=null;render();toast(`${p.n} key removed from Keychain`)}}

function renderCli(p){const on=p.st==='on';side.style.setProperty('--acc',p.acc);
 main.innerHTML=checklist()+`<div class="phead">${logoEl(p,26).outerHTML}<span class="pn" style="color:${p.acc}">${p.n}</span><span class="pd">${p.desc}</span><span class="state ${on?'on':''}">${on?'Signed in':'Not signed in'}</span></div>
  <div class="blk2"><div class="lbl">Accounts</div>${on?p.accts.map(a=>`<div class="acct ${a[2]?'active':''}"><span class="rad"></span><span class="nm">${a[0]} ${a[1]?`<small>· ${a[1]}</small>`:''}</span><span class="state on">${a[2]?'Active':'Signed in'}</span></div>`).join(''):''}
   <div class="row"><button class="btn primary" data-act="signin">${on?'Add account…':'Sign in…'}</button><button class="btn" data-act="check">Check sign-in</button>${p.id==='antigravity'?'<label class="opt" style="margin-left:auto;gap:8px">Ban-risk opt-in<input class="tg" type="checkbox"></label>':''}</div>
   </div>
  <div class="blk2"><div class="lbl">Routes</div>${on&&p.routes.length?p.routes.map(n=>`<div class="mrow is-selected" style="--racc:${p.acc};cursor:default"><span class="lab">${n}</span><span class="ap on" style="--apc:var(--claude)">CL</span><span class="ap on" style="--apc:var(--codex)">CX</span><span class="chk">✓</span></div>`).join(''):`<div class="empty">${on?'No routes.':'Sign in to list routes.'}</div>`}</div>`;
 main.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>act(b.dataset.act,p,e));
 side.innerHTML=`<div class="blk stat"><div class="eyebrow">Status</div><div class="big">${on?p.accts.length+' account'+(p.accts.length===1?'':'s'):'—'}</div><div class="l">${on?'signed in':'not signed in'}</div></div><div class="acts"><button class="btn" data-act="check">Check sign-in</button></div><div class="grow"></div>`;
 side.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>act(b.dataset.act,p,e))}

function renderApp(a){side.style.setProperty('--acc',a.acc);const pub=published();const isC=a.id==='claude';const n=isC?pub.c:pub.x;
 const modes=isC?[['all','Everything','','curated(auto)'],['curate','Curate','','curated'],['slots','Five slots','','mappings']]
  :[['all','All compatible','','all_compatible'],['curate','Custom','','custom']];
 const tiers=isC?`<div class="blk2"><div class="lbl">Tier defaults</div><div class="tierlist">${['fable','opus','sonnet','haiku'].map(t=>{const id=tierDefault(t);const p=id&&modelProv(id);return `<div class="tl"><span class="t">${TIERS[TKEYS.indexOf(t)]}</span><span class="m">${p?logoEl(p,18).outerHTML:''}<span>${id?modelName(id):'<small>none · nearest tier stands in</small>'}</span></span>${id?`<button class="btn sm ghost" data-tab="${p.id}">Change</button>`:''}</div>`}).join('')}</div></div>`
  :`<div class="blk2"><div class="lbl">Default model</div><div class="row"><span class="sel2">${logoEl(byId('kimi'),16).outerHTML} Kimi K3</span></div></div><div class="blk2"><div class="lbl">Subagent priority</div><div class="rank">${[...CAT.entries()].filter(([id,c])=>c.codex).sort((x,y)=>x[1].rank-y[1].rank).slice(0,4).map(([id,c],i)=>`<div class="rk"><span class="n">${i+1}</span><span>${modelName(id)}</span><button class="btn sm ghost" data-tab="${c.p}">Edit</button></div>`).join('')}</div></div>`;
 const opts=isC?[['Teach Claude Code the ids',1],['Ultracode workflows',0],['Auto mode',0],['Browser, dictation, Cowork',0]]:[['Show ChatGPT account',0],['Unlock composer on quota',1],['Quick composer',1],['Apply patches unasked',0]];
 main.innerHTML=checklist()+`<div class="phead">${logoEl(a,26).outerHTML}<span class="pn" style="color:${a.acc}">${a.n}</span><span class="pd">${a.ver}</span><span class="state ${launched[a.id]?'on':''}">${launched[a.id]?'Running':'Closed'}</span></div>
  <div class="blk2"><div class="lbl">Catalogue <span>${n} listed</span></div><div class="choices ${isC?'':'two'}">${modes.map(m=>`<button class="choice" aria-pressed="${a.mode===m[0]}" data-mode="${m[0]}"><h3>${m[1]}</h3><p>${m[2]}</p><span class="k">${m[3]}</span></button>`).join('')}</div></div>${tiers}
  <div class="blk2"><div class="lbl">Options</div><div class="opts">${opts.map(o=>`<label class="opt">${o[0]}<input class="tg" type="checkbox" ${o[1]?'checked':''}></label>`).join('')}</div></div>`;
 main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{a.mode=b.dataset.mode;if(a.mode==='all'){for(const c of CAT.values()){if(isC){c.claude=true;if(c.tier==='off')c.tier='sonnet'}else c.codex=true}}render();toast(a.mode==='all'?'Everything listed':'Curate on each provider tab')});
 side.innerHTML=`<div class="blk stat"><div class="eyebrow">${isC?'Claude':'Codex'}</div><div class="big">${n}</div><div class="l">in picker</div></div>
  <button class="btn primary big" data-launch="${a.id}">${launched[a.id]?'Restart '+(isC?'Claude':'Codex'):'Launch '+(isC?'Claude':'Codex')}</button><button class="btn" data-restore="${a.id}" ${launched[a.id]?'':'disabled'}>Restore</button>
  
  <div class="grow"></div><div class="opts" style="border-top:1px solid var(--border);padding-top:8px"><label class="opt">Stop gateway on quit<input class="tg" type="checkbox" checked></label></div>`;
 side.querySelector('[data-launch]').onclick=e=>{const b=e.currentTarget;b.textContent='Opening…';setTimeout(()=>{launched[a.id]=true;render();toast(`${a.n} opened · ${n} models`)},900)};
 side.querySelector('[data-restore]').onclick=()=>{launched[a.id]=false;render();toast(`${a.n}: previous setup restored`)}}

function renderAudit(){document.getElementById('sheetBody').innerHTML=`<div class="counters"><div class="ct2"><div class="v">184</div><div class="l">requests</div></div><div class="ct2"><div class="v">3</div><div class="l">errors</div></div><div class="ct2"><div class="v">2.4 s</div><div class="l">median TTFB</div></div><div class="ct2"><div class="v">1 / 8</div><div class="l">in flight</div></div></div>
  <div class="tbl"><table><thead><tr><th>Time</th><th>Event</th><th>Model</th><th>Provider</th><th>Status</th></tr></thead><tbody>
   <tr><td>22:04:11</td><td>messages</td><td><code>claude-sonnet-5-kimi-k3</code></td><td>Kimi Code</td><td class="s200">200</td></tr><tr><td>22:03:58</td><td>responses → messages</td><td><code>deepseek-flash</code></td><td>DeepSeek</td><td class="s200">200</td></tr>
   <tr><td>22:03:40</td><td>count_tokens</td><td><code>gpt-oss-120b</code></td><td>Cerebras</td><td class="s200">200</td></tr><tr><td>22:02:07</td><td>messages</td><td><code>grok-4.6</code></td><td>Grok</td><td class="s4">402</td></tr>
   <tr><td>22:01:52</td><td>codex-accent</td><td><code>—</code></td><td>Codex Desktop</td><td class="s200">applied</td></tr><tr><td>22:01:30</td><td>keepalive</td><td><code>qwen3.6-coder</code></td><td>Qwen Token Plan</td><td class="s200">ping</td></tr>
   <tr><td>21:59:14</td><td>messages</td><td><code>spark-1.3</code></td><td>Muse</td><td class="s5">502</td></tr></tbody></table></div>
  <div class="acts" style="display:flex;gap:6px;padding:10px 6px 0;border:0"><button class="btn sm">Open data folder</button><button class="btn sm">Copy last-upstream-shape.json</button><button class="btn sm danger">Stop gateway</button></div>`;document.getElementById('sheet').hidden=false}
document.getElementById('auditBtn').onclick=renderAudit;document.getElementById('sheetClose').onclick=()=>document.getElementById('sheet').hidden=true;document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.target.hidden=true};
// chrome
const shell=document.getElementById('shell');let gatewayOn=true;document.getElementById('gwBtn').onclick=()=>{gatewayOn=!gatewayOn;document.getElementById('gwDot').classList.toggle('off',!gatewayOn);document.getElementById('gwBtn').textContent=gatewayOn?'Stop':'Start';document.getElementById('gwBtn').title=gatewayOn?'Stop the gateway':'Start the gateway';toast(gatewayOn?'Gateway listening on 127.0.0.1:8899':'Gateway stopped')};document.getElementById('appicon').src=LOGOS.__app;
document.getElementById('dbg').onchange=e=>{document.getElementById('auditBtn').hidden=!e.target.checked};
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
try{const h=location.hash.replace('#','');if(h&&byId(h))tab=h}catch(e){}
shell.classList.add('expert');shell.classList.add('compact');render();
</script>
